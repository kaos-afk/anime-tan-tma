<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anime Önerme Sistemi</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Instagram butonu için CSS */
    .instagram-button {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: transparent;
      border: none;
      cursor: pointer;
    }

    .instagram-button img {
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body>

  <!-- Hamburger Menü (3 çizgi) -->
  <div id="menu-toggle" class="menu-toggle">
    &#9776;
  </div>

  <!-- Menü -->
  <div id="menu" class="menu">
    <ul>
      <li><a href="javascript:void(0)" onclick="showAnimeRecommendations()">Anime Öner</a></li>
    </ul>
  </div>

  <header>
    <div class="header-content">
      <img src="tanjiro.jpg" alt="Tanjiro" class="tanjiro-img">
      <h1>Anime Site</h1>
    </div>
  </header>

  <!-- Kategori Seçimi -->
  <div id="category-select">
    <select id="category-filter" onchange="filterAnimeByCategory()">
      <option value="">Tüm Kategoriler</option>
      <option value="Aksiyon">Aksiyon</option>
      <option value="Macera">Macera</option>
      <option value="Komedi">Komedi</option>
      <option value="Drama">Drama</option>
      <option value="Romantik">Romantik</option>
    </select>
  </div>

  <main>
    <!-- Anime Listeleme Alanı -->
    <div class="anime-container" id="anime-list">
      <!-- Anime verileri burada dinamik olarak görünecek -->
    </div>
  </main>

  <div id="anime-details" class="anime-details" style="display: none;">
    <button onclick="closeDetails()">Kapat</button>
    <h2 id="anime-title"></h2>
    <img id="anime-image" src="" alt="Anime Resmi" />
    <p id="anime-description"></p>
    <h3>Mevcut Puan: <span id="anime-rating">0</span></h3>
    <button onclick="rateAnime()">Puanla</button>
  </div>

  <!-- Instagram Butonu -->
  <button class="instagram-button" onclick="window.open('https://www.instagram.com/yusufiy0/', '_blank')">
    <img src="Instagram.png" alt="Instagram" />
  </button>

  <script src="app.js"></script>
  <script>
    // Manuel olarak eklediğimiz anime verileri
    const manualAnimeData = [
      {
        mal_id: 1,
        title: "Naruto",
        images: {
          jpg: { image_url: "https://cdn.myanimelist.net/images/anime/1/23179.jpg" }
        },
        synopsis: "Naruto, hayalindeki Hokage olabilmek için savaşıyor.",
        rating: 8.5,
        category: "Aksiyon"
      },
      {
        mal_id: 2,
        title: "One Piece",
        images: {
          jpg: { image_url: "https://cdn.myanimelist.net/images/anime/6/75226.jpg" }
        },
        synopsis: "Monkey D. Luffy'nin denizcilik hayalini takip eden bir macera.",
        rating: 9.2,
        category: "Macera"
      },
      {
        mal_id: 3,
        title: "Fullmetal Alchemist: Brotherhood",
        images: {
          jpg: { image_url: "https://cdn.myanimelist.net/images/anime/11/72044.jpg" }
        },
        synopsis: "İki kardeşin kaybettikleri vücutlarını geri alabilmek için çıktığı yolculuk.",
        rating: 9.4,
        category: "Aksiyon"
      },
      {
        mal_id: 4,
        title: "Kimi no Na wa",
        images: {
          jpg: { image_url: "https://cdn.myanimelist.net/images/anime/4/85068.jpg" }
        },
        synopsis: "İki gencin bedenlerini değiştirerek yaşadıkları romantik bir hikaye.",
        rating: 8.8,
        category: "Drama"
      },
      // Yeni Nesil Anime Eklemeleri
      {
        mal_id: 5,
        title: "Demon Slayer",
        images: {
          jpg: { image_url: "https://cdn.myanimelist.net/images/anime/1290/106441.jpg" }
        },
        synopsis: "Tanjiro Kamado, ailesini kaybettikten sonra intikam almak için bir Demon Slayer'a dönüşür.",
        rating: 8.7,
        category: "Aksiyon"
      },
      {
        mal_id: 6,
        title: "Attack on Titan",
        images: {
          jpg: { image_url: "https://cdn.myanimelist.net/images/anime/10/77394.jpg" }
        },
        synopsis: "Dev yaratıklar tarafından yok edilen insanlığın hayatta kalan son savunma hattı.",
        rating: 9.1,
        category: "Aksiyon"
      },
      {
        mal_id: 7,
        title: "Jujutsu Kaisen",
        images: {
          jpg: { image_url: "https://cdn.myanimelist.net/images/anime/1775/112237.jpg" }
        },
        synopsis: "Yuji Itadori'nin, lanetli varlıklara karşı mücadele ederken kazandığı güçleri kullanması.",
        rating: 8.9,
        category: "Aksiyon"
      },
      {
        mal_id: 8,
        title: "My Hero Academia",
        images: {
          jpg: { image_url: "https://cdn.myanimelist.net/images/anime/7/87921.jpg" }
        },
        synopsis: "Herkesin süper güce sahip olduğu bir dünyada, bir genç kahraman olmak için mücadele eder.",
        rating: 8.6,
        category: "Aksiyon"
      }
    ];

    // Jikan API'den Anime Verilerini Çekme
    async function fetchAnimeData(page = 1) {
      try {
        const response = await fetch(`https://api.jikan.moe/v4/anime?page=${page}`);
        const data = await response.json();

        // Anime verisini birleştirme: API'den gelen ve manuel veriler
        const combinedAnimeData = [...manualAnimeData, ...data.data];

        // Anime verilerini listeye ekleme
        displayAnimeList(combinedAnimeData);
        
      } catch (error) {
        console.error('Anime verisi alınırken bir hata oluştu:', error);
      }
    }

    // Anime Listesini Görüntüleme
    function displayAnimeList(animeData) {
      const animeList = document.getElementById('anime-list');
      animeList.innerHTML = ''; // Önceki listeyi temizle

      animeData.forEach(anime => {
        const animeElement = document.createElement('div');
        animeElement.classList.add('anime');
        animeElement.innerHTML = `
          <img src="${anime.images.jpg.image_url || 'https://via.placeholder.com/150'}" alt="${anime.title}" />
          <h2>${anime.title}</h2>
          <p>Kategori: ${anime.category}</p>
          <button onclick="showDetails('${anime.mal_id}')">Detaylar</button>
        `;
        animeList.appendChild(animeElement);
      });
    }

    // Sayfa yüklendiğinde anime verilerini çek
    window.onload = () => fetchAnimeData(1);

    // Anime Detayları Gösterme
    function showDetails(animeId) {
      const animeDetails = document.getElementById('anime-details');
      const animeTitle = document.getElementById('anime-title');
      const animeImage = document.getElementById('anime-image');
      const animeDescription = document.getElementById('anime-description');

      // API'den detaylı anime verisini al
      fetch(`https://api.jikan.moe/v4/anime/${animeId}`)
        .then(response => response.json())
        .then(data => {
          animeTitle.textContent = data.data.title;
          animeImage.src = data.data.images.jpg.image_url || 'https://via.placeholder.com/150';
          animeDescription.textContent = data.data.synopsis;  // Burada Türkçe açıklama olacak
          animeDetails.style.display = 'block';
        });
    }

    // Detayları Kapat
    function closeDetails() {
      const animeDetails = document.getElementById('anime-details');
      animeDetails.style.display = 'none';
    }

    // Kategoriye Göre Anime Filtreleme
    function filterAnimeByCategory() {
      const selectedCategory = document.getElementById('category-filter').value;
      
      fetchAnimeData(1).then(() => {
        const filteredAnime = manualAnimeData.filter(anime => {
          return selectedCategory === "" || anime.category === selectedCategory;
        });
        displayAnimeList(filteredAnime);
      });
    }
  </script>

</body>
</html>
